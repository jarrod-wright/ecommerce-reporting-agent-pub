name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        run: pipx install poetry

      - name: Install dependencies
        run: poetry install

      - name: Lint (ruff)
        run: poetry run ruff check .

      - name: Test (pytest)
        # Test-suite security keys are provisioned by tests/conftest.py (demo
        # values) — no real secrets are required or referenced in CI.
        run: poetry run pytest
  compose:
    # Plan step 1 done-when: a CI job runs compose and a smoke request passes.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare .env from example (demo secrets for the smoke container)
        run: |
          cp .env.example .env
          # Fail-closed Settings demands non-placeholder secrets; CI uses
          # throwaway demo values that never leave this container.
          printf 'WEBHOOK_SECRET_KEY=demo-webhook-secret-not-a-real-credential\nJWT_SECRET_KEY=demo-jwt-secret-not-a-real-credential\n' >> .env

      - name: Build and start (docker compose up --build)
        run: docker compose up --build -d

      - name: Smoke request
        run: |
          for i in $(seq 1 45); do
            if curl -fsS http://localhost:8080/health > /dev/null 2>&1; then
              echo "smoke OK"; exit 0
            fi
            sleep 2
          done
          echo "smoke request failed"; docker compose logs --tail 100; exit 1

      - name: Stop
        if: always()
        run: docker compose down
